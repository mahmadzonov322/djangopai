{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gaming LAB{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'admin/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        :root {
            --neon-purple: #8b5cf6;
            --neon-cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #ddd;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;   /* Bu muhim! */
        }

        /* ORQA FON ANIMATSIYASI */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 25% 25%, rgba(250, 144, 33, 0.18), transparent 60%),
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.18), transparent 60%),
                #0a0a0a;
            z-index: -2;
            animation: neonPulse 18s ease infinite;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(white 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.08;
            z-index: -1;
            animation: starsMove 100s linear infinite;
        }

        @keyframes neonPulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }

        @keyframes starsMove {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        /* ================= CHAP SIDEBAR ================= */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 90px;
            height: 100vh;
            background: linear-gradient(180deg, #111 0%, #1a1a2e 100%);
            z-index: 150;
            border-right: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* ================= NAVBAR ================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 90px;
            right: 0;
            height: 70px;
            background: rgba(10, 10, 20, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.4);
            z-index: 1040;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .nav-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #a855f7, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            gap: 40px;
            margin-left: auto;
            list-style: none;
        }

        .nav-menu a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }

        .nav-menu a:hover {
            color: var(--neon-cyan);
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -6px;
            left: 0;
            background: linear-gradient(to right, var(--neon-purple), var(--neon-cyan));
            transition: 0.3s;
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        .nav-buttons {
            margin-left: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 26px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s;
        }

        .btn-register {
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--neon-purple), #6d28d9);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.6);
        }

        /* ================= KONTENT ================= */
        main {
            margin-left: 90px;
            margin-top: 70px;
            padding: 40px;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    {% include "includes/navbarchap.html" %}

    <nav class="navbar">
        <div class="nav-logo">GAMING LAB</div>
        
        <ul class="nav-menu">
            <li><a href="{% url 'index' %}">Asosiy bolim</a></li>
            <li><a href="{% url 'about' %}">sayt haqida</a></li>
            <li><a href="{% url 'portfolio' %}">Portfolio</a></li>
            <li><a href="{% url 'news' %}">Yangiliklar</a></li>
            
        </ul>

        <div class="nav-buttons">
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="btn btn-register">Logout</a>
            {% else %}
                <a href="{% url 'register' %}" class="btn btn-register">Register</a>
                <a href="{% url 'login' %}" class="btn btn-login">Login</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
